<!-- Service worker registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        // Check for updates whenever the app is opened
        reg.update();

        // If a new SW is waiting, prompt to activate it
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');

        reg.addEventListener('updatefound', () => {
          const installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', () => {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              installing.postMessage('SKIP_WAITING');
            }
          });
        });
      }).catch(() => { /* fine if it fails on file:// */ });

      // Reload once when the new SW takes control, so we get the new index.html
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>

const STORAGE_KEY = 'house-ledger-v1';
const VERSION = '1.4';
const VERSION_DATE = '2026-05-08';

const todayISO = () => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const daysBetween = (a, b) => {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
};
const formatDate = (iso) => {
  if (!iso) return null;
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
};
const formatDateLong = (iso) => {
  if (!iso) return null;
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
};
const offsetISO = (n) => {
  const d = new Date();
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const statusFor = (task, lastDone) => {
  if (!lastDone) return { kind: 'never', overdueBy: 0, daysSince: null };
  const since = daysBetween(lastDone, todayISO());
  const overdueBy = since - task.cadence;
  if (overdueBy > 3) return { kind: 'overdue', overdueBy, daysSince: since };
  if (overdueBy >= 0) return { kind: 'due', overdueBy, daysSince: since };
  return { kind: 'fresh', overdueBy, daysSince: since };
};

function ChoreTracker() {
  const [history, setHistory] = useState({});
  const [tasks, setTasks] = useState(DEFAULT_TASKS);
  const [filter, setFilter] = useState('all');
  const [view, setView] = useState('list');
  const [loading, setLoading] = useState(true);
  const [showSettings, setShowSettings] = useState(false);
  const [showInstall, setShowInstall] = useState(false);
  const [installPrompt, setInstallPrompt] = useState(null);

  const [logTask, setLogTask] = useState(null);
  const [historyTask, setHistoryTask] = useState(null);

  const [calMonth, setCalMonth] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  const [calSelectedDate, setCalSelectedDate] = useState(null);

  // Load
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setHistory(parsed.history || {});
        if (parsed.tasks) {
          // Merge: keep saved tasks (preserves edited cadences) but append any
          // new defaults that didn't exist before (e.g. Bathrooms group added in v1.2)
          const savedIds = new Set(parsed.tasks.map((t) => t.id));
          const merged = [...parsed.tasks, ...DEFAULT_TASKS.filter((t) => !savedIds.has(t.id))];
          setTasks(merged);
        }
      }
    } catch (e) { /* first run */ }
    setLoading(false);
  }, []);

  // Save
  useEffect(() => {
    if (loading) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, tasks }));
    } catch (e) { console.error('save failed', e); }
  }, [history, tasks, loading]);

  // PWA install prompt capture
  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setInstallPrompt(e);
      setShowInstall(true);
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const triggerInstall = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    setInstallPrompt(null);
    setShowInstall(false);
  };

  const addEntry = (taskId, iso) => {
    setHistory((h) => {
      const arr = h[taskId] || [];
      if (arr.includes(iso)) return h;
      return { ...h, [taskId]: [...arr, iso].sort() };
    });
  };
  const removeEntry = (taskId, iso) => {
    setHistory((h) => ({ ...h, [taskId]: (h[taskId] || []).filter((d) => d !== iso) }));
  };
  const updateCadence = (taskId, newCadence) => {
    setTasks((ts) => ts.map((t) => (t.id === taskId ? { ...t, cadence: newCadence } : t)));
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ history, tasks }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `house-ledger-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.history) setHistory(parsed.history);
        if (parsed.tasks) setTasks(parsed.tasks);
      } catch (err) {
        alert('That file does not look like a valid Ledger backup.');
      }
    };
    reader.readAsText(file);
  };

  const enriched = useMemo(() => tasks.map((t) => {
    const arr = history[t.id] || [];
    const lastDone = arr.length ? arr[arr.length - 1] : null;
    return { ...t, lastDone, history: arr, status: statusFor(t, lastDone) };
  }), [tasks, history]);

  const filtered = useMemo(() => {
    if (filter === 'all') return enriched;
    if (filter === 'overdue') return enriched.filter((t) => t.status.kind === 'overdue' || t.status.kind === 'never');
    if (filter === 'due') return enriched.filter((t) => ['due', 'overdue', 'never'].includes(t.status.kind));
    return enriched;
  }, [enriched, filter]);

  const counts = useMemo(() => ({
    overdue: enriched.filter((t) => t.status.kind === 'overdue' || t.status.kind === 'never').length,
    due:     enriched.filter((t) => t.status.kind === 'due').length,
    fresh:   enriched.filter((t) => t.status.kind === 'fresh').length,
    total:   enriched.length,
  }), [enriched]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach((t) => { (map[t.group] = map[t.group] || []).push(t); });
    const order = { never: 0, overdue: 1, due: 2, fresh: 3 };
    Object.values(map).forEach((arr) => arr.sort((a, b) => order[a.status.kind] - order[b.status.kind]));
    return map;
  }, [filtered]);

  const dateIndex = useMemo(() => {
    const idx = {};
    Object.entries(history).forEach(([taskId, dates]) => {
      dates.forEach((d) => { (idx[d] = idx[d] || []).push(taskId); });
    });
    return idx;
  }, [history]);

  return (
    <div className="min-h-screen w-full" style={{
      background: '#f4ede0',
      backgroundImage: `
        radial-gradient(circle at 20% 10%, rgba(180, 140, 90, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(120, 90, 60, 0.06) 0%, transparent 50%),
        repeating-linear-gradient(0deg, transparent 0px, transparent 31px, rgba(120, 90, 60, 0.06) 31px, rgba(120, 90, 60, 0.06) 32px)
      `,
      fontFamily: '"Fraunces", "Times New Roman", serif',
      color: '#2a1f15',
    }}>
      <div className="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-10">

        <header className="mb-6 pb-6" style={{ borderBottom: '3px double #2a1f15' }}>
          <div className="flex items-baseline justify-between mb-2">
            <span className="mono text-xs tracking-[0.2em] uppercase" style={{ color: '#7a5f3f' }}>
              No. 001 · Est. {new Date().getFullYear()}
            </span>
            <span className="mono text-xs tracking-wider" style={{ color: '#7a5f3f' }}>
              {new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}
            </span>
          </div>
          <h1 className="text-5xl sm:text-6xl font-extrabold leading-none tracking-tight" style={{
            fontVariationSettings: '"opsz" 144', letterSpacing: '-0.03em',
          }}>
            The House<br/>
            <span className="italic font-light" style={{ color: '#7a5f3f' }}>Ledger</span>
          </h1>
          <p className="mono text-xs mt-3 tracking-wide" style={{ color: '#7a5f3f' }}>
            A record of household chores · kept faithfully
          </p>
        </header>

        {showInstall && installPrompt && (
          <div className="mb-4 p-3 flex items-center justify-between gap-2 fadein"
               style={{ background: '#2a1f15', color: '#f4ede0', border: '1.5px solid #2a1f15', boxShadow: '2px 2px 0 #7a5f3f' }}>
            <div className="text-sm">
              <div className="font-semibold">Install as app?</div>
              <div className="mono text-[10px] tracking-widest uppercase opacity-80">Adds to home screen · works offline</div>
            </div>
            <div className="flex gap-1">
              <button onClick={triggerInstall} className="px-3 py-1.5 text-xs font-semibold"
                      style={{ background: '#7a8b5c', border: '1.5px solid #f4ede0' }}>Install</button>
              <button onClick={() => setShowInstall(false)} className="px-2 py-1.5"
                      style={{ background: 'transparent', border: '1.5px solid #f4ede0' }} aria-label="Dismiss">
                <X size={12} />
              </button>
            </div>
          </div>
        )}

        <div className="flex mb-6" style={{ border: '1.5px solid #2a1f15', boxShadow: '2px 2px 0 #2a1f15' }}>
          <ViewTab active={view === 'list'} onClick={() => setView('list')} icon={<List size={14} />} label="List" />
          <ViewTab active={view === 'calendar'} onClick={() => setView('calendar')} icon={<CalendarIcon size={14} />} label="Calendar" />
        </div>

        {view === 'list' && (
          <>
            <div className="grid grid-cols-3 gap-3 mb-6">
              <StatCard tone="overdue" label="Overdue" value={counts.overdue} active={filter === 'overdue'} onClick={() => setFilter(filter === 'overdue' ? 'all' : 'overdue')} />
              <StatCard tone="due"     label="Due now" value={counts.due}     active={filter === 'due'}     onClick={() => setFilter(filter === 'due' ? 'all' : 'due')} />
              <StatCard tone="fresh"   label="Fresh"   value={counts.fresh}   active={false}                onClick={() => setFilter('all')} />
            </div>

            <div className="flex items-center justify-between mb-6 mono text-xs uppercase tracking-widest gap-3">
              <span style={{ color: '#7a5f3f' }}>{filtered.length} of {counts.total}</span>
              <div className="flex items-center gap-3">
                <button onClick={() => setShowSettings((s) => !s)} className="underline underline-offset-4 hover:no-underline" style={{ color: '#2a1f15' }}>
                  {showSettings ? 'close' : 'cadences'}
                </button>
                <button onClick={exportData} className="hover:opacity-70" title="Export backup" aria-label="Export backup"><Download size={12} /></button>
                <label className="hover:opacity-70 cursor-pointer" title="Import backup" aria-label="Import backup">
                  <Upload size={12} />
                  <input type="file" accept="application/json" className="hidden" onChange={(e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; }} />
                </label>
              </div>
            </div>

            {showSettings && (
              <div className="mb-6 p-4" style={{ background: '#ebe0c9', border: '1.5px solid #2a1f15' }}>
                <h3 className="mono text-xs uppercase tracking-widest mb-3" style={{ color: '#7a5f3f' }}>
                  Days between completions before each task is due again
                </h3>
                <div className="space-y-2 max-h-72 overflow-y-auto">
                  {tasks.map((t) => (
                    <div key={t.id} className="flex items-center justify-between text-sm">
                      <span className="truncate pr-2">
                        <span className="mono text-xs" style={{ color: '#7a5f3f' }}>{GROUP_META[t.group]?.tag} </span>
                        {t.label} <span className="italic" style={{ color: '#7a5f3f' }}>· {t.group}</span>
                      </span>
                      <input type="number" min="1" max="365" value={t.cadence}
                        onChange={(e) => updateCadence(t.id, parseInt(e.target.value) || 1)}
                        className="mono w-16 px-2 py-1 text-right"
                        style={{ background: '#f4ede0', border: '1px solid #2a1f15' }} />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {loading && (<div className="text-center py-12 mono text-sm" style={{ color: '#7a5f3f' }}>Opening the ledger…</div>)}

            {!loading && GROUP_ORDER.map((groupName) => {
              const items = grouped[groupName];
              if (!items || items.length === 0) return null;
              const meta = GROUP_META[groupName];
              return (
                <section key={groupName} className="mb-8">
                  <div className="flex items-baseline gap-3 mb-3">
                    <span className="mono text-2xl font-bold" style={{ color: '#7a5f3f' }}>{meta.tag}</span>
                    <h2 className="text-2xl font-bold tracking-tight" style={{ letterSpacing: '-0.02em' }}>{groupName}</h2>
                    <span className="italic text-sm" style={{ color: '#7a5f3f' }}>{meta.sub}</span>
                  </div>
                  <div className="space-y-2">
                    {items.map((task) => (
                      <TaskRow
                        key={task.id} task={task}
                        onQuickDone={() => addEntry(task.id, todayISO())}
                        onPickDate={() => setLogTask(task)}
                        onOpenHistory={() => setHistoryTask(task)}
                      />
                    ))}
                  </div>
                </section>
              );
            })}

            {!loading && filtered.length === 0 && (
              <div className="text-center py-16">
                <div className="text-5xl mb-4">✓</div>
                <p className="text-xl italic">All caught up.</p>
                <p className="mono text-xs mt-2 tracking-widest uppercase" style={{ color: '#7a5f3f' }}>The house is in order</p>
              </div>
            )}
          </>
        )}

        {view === 'calendar' && (
          <CalendarView
            month={calMonth} setMonth={setCalMonth}
            dateIndex={dateIndex} tasks={tasks}
            selectedDate={calSelectedDate} setSelectedDate={setCalSelectedDate}
            onRemoveEntry={removeEntry}
          />
        )}

        <footer className="mt-12 pt-6 mono text-[10px] text-center tracking-widest uppercase" style={{
          borderTop: '1px solid #c4b596', color: '#7a5f3f',
        }}>
          Tap row to log today · 📅 for a different date · ↻ for full history
          <div className="mt-2 opacity-70">v{VERSION} · {VERSION_DATE}</div>
        </footer>
      </div>

      {logTask && (
        <DatePickerModal task={logTask} onClose={() => setLogTask(null)}
          onConfirm={(iso) => { addEntry(logTask.id, iso); setLogTask(null); }} />
      )}
      {historyTask && (
        <HistoryModal task={enriched.find((t) => t.id === historyTask.id)}
          onClose={() => setHistoryTask(null)}
          onRemove={(iso) => removeEntry(historyTask.id, iso)}
          onAdd={(iso) => addEntry(historyTask.id, iso)} />
      )}
    </div>
  );
}

function ViewTab({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick}
      className="flex-1 flex items-center justify-center gap-2 py-2.5 mono text-xs uppercase tracking-widest transition-colors"
      style={{ background: active ? '#2a1f15' : 'transparent', color: active ? '#f4ede0' : '#2a1f15' }}>
      {icon} {label}
    </button>
  );
}

function StatCard({ tone, label, value, active, onClick }) {
  const tones = {
    overdue: { bg: '#c44536', fg: '#f4ede0' },
    due:     { bg: '#d4a04a', fg: '#2a1f15' },
    fresh:   { bg: '#7a8b5c', fg: '#f4ede0' },
  };
  const t = tones[tone];
  return (
    <button onClick={onClick}
      className={`p-3 text-left transition-transform ${active ? 'scale-105' : 'hover:scale-[1.02]'}`}
      style={{ background: t.bg, color: t.fg, border: '1.5px solid #2a1f15',
               boxShadow: active ? '4px 4px 0 #2a1f15' : '2px 2px 0 #2a1f15' }}>
      <div className="mono text-[10px] uppercase tracking-widest opacity-90">{label}</div>
      <div className="text-3xl font-extrabold leading-none mt-1" style={{ letterSpacing: '-0.04em' }}>{value}</div>
    </button>
  );
}

function TaskRow({ task, onQuickDone, onPickDate, onOpenHistory }) {
  const [justDone, setJustDone] = useState(false);
  const { status, lastDone, cadence } = task;

  const handleQuickDone = () => {
    setJustDone(true);
    setTimeout(() => setJustDone(false), 600);
    onQuickDone();
  };

  const statusStyles = {
    overdue: { bg: '#fce8e3', accent: '#c44536', icon: <AlertTriangle size={14} /> },
    never:   { bg: '#fce8e3', accent: '#c44536', icon: <AlertTriangle size={14} /> },
    due:     { bg: '#faf0d8', accent: '#a87a2c', icon: <Clock size={14} /> },
    fresh:   { bg: '#eef0e3', accent: '#5e6e44', icon: <Check size={14} /> },
  };
  const s = statusStyles[status.kind];

  const statusLabel =
    status.kind === 'never'   ? 'Never logged' :
    status.kind === 'overdue' ? `${status.overdueBy} day${status.overdueBy === 1 ? '' : 's'} overdue` :
    status.kind === 'due'     ? 'Due today' :
                                `${Math.abs(status.overdueBy)} day${Math.abs(status.overdueBy) === 1 ? '' : 's'} until due`;

  return (
    <div className="flex items-stretch" style={{ background: s.bg, border: '1.5px solid #2a1f15', boxShadow: '2px 2px 0 #2a1f15' }}>
      <button onClick={handleQuickDone}
        className="flex-1 flex items-center justify-between gap-3 px-4 py-3 text-left active:translate-x-[1px] active:translate-y-[1px] transition-transform">
        <div className="flex items-center gap-3 min-w-0">
          <div className={`flex-shrink-0 w-7 h-7 flex items-center justify-center transition-all ${justDone ? 'stamp-anim' : ''}`}
            style={{ background: justDone ? '#7a8b5c' : 'transparent',
                     border: `1.5px solid ${s.accent}`,
                     color: justDone ? '#f4ede0' : s.accent }}>
            {justDone ? <Check size={16} strokeWidth={3} /> : s.icon}
          </div>
          <div className="min-w-0">
            <div className={`font-semibold truncate strikethrough-grow ${justDone ? 'done' : ''}`} style={{ letterSpacing: '-0.01em' }}>
              {task.label}
            </div>
            <div className="mono text-[11px] tracking-wide" style={{ color: s.accent }}>
              {statusLabel}
              {lastDone && ` · last ${formatDate(lastDone)}`}
              <span style={{ color: '#7a5f3f' }}> · every {cadence}d</span>
            </div>
          </div>
        </div>
      </button>

      <button onClick={onPickDate}
        className="px-3 flex items-center justify-center hover:bg-black/5 transition-colors"
        style={{ borderLeft: '1.5px solid #2a1f15', color: '#7a5f3f' }}
        aria-label="Log for a different date" title="Log for a different date">
        <CalendarIcon size={14} />
      </button>
      <button onClick={onOpenHistory}
        className="px-3 flex items-center justify-center hover:bg-black/5 transition-colors"
        style={{ borderLeft: '1.5px solid #2a1f15', color: '#7a5f3f' }}
        aria-label="View history" title="View history">
        <RotateCcw size={14} />
      </button>
    </div>
  );
}

function ModalShell({ children, onClose, title, subtitle }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
         style={{ background: 'rgba(42, 31, 21, 0.5)' }} onClick={onClose}>
      <div className="w-full sm:max-w-md fadein"
           style={{ background: '#f4ede0', border: '2px solid #2a1f15', boxShadow: '4px 4px 0 #2a1f15',
                    maxHeight: '90vh', overflowY: 'auto' }}
           onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between p-4 sm:p-5" style={{ borderBottom: '1.5px solid #2a1f15' }}>
          <div className="min-w-0">
            <h3 className="text-xl font-bold leading-tight" style={{ letterSpacing: '-0.02em' }}>{title}</h3>
            {subtitle && <p className="mono text-xs mt-1 tracking-wide" style={{ color: '#7a5f3f' }}>{subtitle}</p>}
          </div>
          <button onClick={onClose} className="flex-shrink-0 p-1 hover:bg-black/5" aria-label="Close">
            <X size={18} />
          </button>
        </div>
        <div className="p-4 sm:p-5">{children}</div>
      </div>
    </div>
  );
}

function DatePickerModal({ task, onClose, onConfirm }) {
  const [date, setDate] = useState(todayISO());
  const presets = [
    { label: 'Today',      offset: 0 },
    { label: 'Yesterday',  offset: -1 },
    { label: '2 days ago', offset: -2 },
    { label: '3 days ago', offset: -3 },
  ];

  return (
    <ModalShell onClose={onClose} title={task.label} subtitle={`${task.group.toUpperCase()} · log a completion date`}>
      <div className="grid grid-cols-2 gap-2 mb-4">
        {presets.map((p) => {
          const iso = offsetISO(p.offset);
          const active = date === iso;
          return (
            <button key={p.label} onClick={() => setDate(iso)}
              className="px-3 py-2.5 text-sm transition-transform"
              style={{ background: active ? '#2a1f15' : '#ebe0c9',
                       color: active ? '#f4ede0' : '#2a1f15',
                       border: '1.5px solid #2a1f15',
                       boxShadow: active ? '3px 3px 0 #2a1f15' : '1px 1px 0 #2a1f15' }}>
              <div className="font-semibold">{p.label}</div>
              <div className="mono text-[10px] opacity-80">{formatDate(iso)}</div>
            </button>
          );
        })}
      </div>

      <label className="block mb-4">
        <span className="mono text-xs uppercase tracking-widest" style={{ color: '#7a5f3f' }}>Or pick a date</span>
        <input type="date" value={date} max={todayISO()}
          onChange={(e) => setDate(e.target.value)}
          className="mono w-full mt-1 px-3 py-2.5 text-base"
          style={{ background: '#fff', border: '1.5px solid #2a1f15' }} />
      </label>

      <div className="flex gap-2">
        <button onClick={onClose} className="flex-1 px-4 py-2.5 text-sm font-semibold"
          style={{ background: '#ebe0c9', border: '1.5px solid #2a1f15' }}>Cancel</button>
        <button onClick={() => onConfirm(date)} className="flex-1 px-4 py-2.5 text-sm font-semibold"
          style={{ background: '#7a8b5c', color: '#f4ede0', border: '1.5px solid #2a1f15', boxShadow: '2px 2px 0 #2a1f15' }}>
          Log it
        </button>
      </div>
    </ModalShell>
  );
}

function HistoryModal({ task, onClose, onRemove, onAdd }) {
  const [showAdd, setShowAdd] = useState(false);
  if (!task) return null;
  const dates = [...(task.history || [])].reverse();

  return (
    <ModalShell onClose={onClose} title={task.label}
      subtitle={`${task.group.toUpperCase()} · ${dates.length} completion${dates.length === 1 ? '' : 's'} logged`}>
      {dates.length === 0 && (
        <div className="text-center py-6 mono text-sm" style={{ color: '#7a5f3f' }}>No completions logged yet.</div>
      )}

      {dates.length > 0 && (
        <div className="space-y-1.5 mb-4 max-h-64 overflow-y-auto">
          {dates.map((iso, i) => (
            <div key={iso} className="flex items-center justify-between px-3 py-2"
              style={{ background: i === 0 ? '#eef0e3' : '#ebe0c9', border: '1px solid #2a1f15' }}>
              <div>
                <div className="font-semibold text-sm">{formatDateLong(iso)}</div>
                {i === 0 && <div className="mono text-[10px] uppercase tracking-widest" style={{ color: '#5e6e44' }}>Most recent</div>}
              </div>
              <button onClick={() => onRemove(iso)} className="p-1.5 hover:bg-black/5"
                style={{ color: '#c44536' }} aria-label="Delete this entry" title="Delete this entry">
                <Trash2 size={14} />
              </button>
            </div>
          ))}
        </div>
      )}

      {!showAdd && (
        <button onClick={() => setShowAdd(true)} className="w-full px-4 py-2.5 text-sm font-semibold"
          style={{ background: '#ebe0c9', border: '1.5px dashed #2a1f15' }}>
          + Add a missed date
        </button>
      )}

      {showAdd && (
        <AddDateInline onCancel={() => setShowAdd(false)} onConfirm={(iso) => { onAdd(iso); setShowAdd(false); }} />
      )}
    </ModalShell>
  );
}

function AddDateInline({ onCancel, onConfirm }) {
  const [date, setDate] = useState(todayISO());
  return (
    <div className="p-3" style={{ background: '#ebe0c9', border: '1.5px solid #2a1f15' }}>
      <label className="block mb-3">
        <span className="mono text-xs uppercase tracking-widest" style={{ color: '#7a5f3f' }}>Date completed</span>
        <input type="date" value={date} max={todayISO()}
          onChange={(e) => setDate(e.target.value)}
          className="mono w-full mt-1 px-3 py-2 text-base"
          style={{ background: '#fff', border: '1.5px solid #2a1f15' }} />
      </label>
      <div className="flex gap-2">
        <button onClick={onCancel} className="flex-1 px-3 py-2 text-sm"
          style={{ background: '#f4ede0', border: '1.5px solid #2a1f15' }}>Cancel</button>
        <button onClick={() => onConfirm(date)} className="flex-1 px-3 py-2 text-sm font-semibold"
          style={{ background: '#7a8b5c', color: '#f4ede0', border: '1.5px solid #2a1f15' }}>Add</button>
      </div>
    </div>
  );
}

function CalendarView({ month, setMonth, dateIndex, tasks, selectedDate, setSelectedDate, onRemoveEntry }) {
  const taskById = useMemo(() => Object.fromEntries(tasks.map((t) => [t.id, t])), [tasks]);

  const monthStart = new Date(month.year, month.month, 1);
  const monthName = monthStart.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(month.year, month.month + 1, 0).getDate();
  const firstDayJS = monthStart.getDay();
  const firstDayMon = (firstDayJS + 6) % 7;

  const today = todayISO();
  const cells = [];
  for (let i = 0; i < firstDayMon; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${month.year}-${String(month.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push({ d, iso });
  }
  while (cells.length % 7 !== 0) cells.push(null);

  const prevMonth = () => {
    const m = month.month - 1;
    if (m < 0) setMonth({ year: month.year - 1, month: 11 });
    else setMonth({ year: month.year, month: m });
    setSelectedDate(null);
  };
  const nextMonth = () => {
    const m = month.month + 1;
    if (m > 11) setMonth({ year: month.year + 1, month: 0 });
    else setMonth({ year: month.year, month: m });
    setSelectedDate(null);
  };

  const selectedEntries = selectedDate
    ? (dateIndex[selectedDate] || []).map((tid) => taskById[tid]).filter(Boolean)
    : [];

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={prevMonth} className="p-2 hover:bg-black/5" style={{ border: '1.5px solid #2a1f15' }} aria-label="Previous month">
          <ChevronLeft size={16} />
        </button>
        <h2 className="text-2xl font-bold tracking-tight" style={{ letterSpacing: '-0.02em' }}>{monthName}</h2>
        <button onClick={nextMonth} className="p-2 hover:bg-black/5" style={{ border: '1.5px solid #2a1f15' }} aria-label="Next month">
          <ChevronRight size={16} />
        </button>
      </div>

      <div className="grid grid-cols-7 mb-1 mono text-[10px] uppercase tracking-widest text-center" style={{ color: '#7a5f3f' }}>
        {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d) => <div key={d} className="py-1">{d}</div>)}
      </div>

      <div className="grid grid-cols-7 gap-1" style={{ border: '1.5px solid #2a1f15', padding: 4, background: '#ebe0c9' }}>
        {cells.map((cell, i) => {
          if (!cell) return <div key={i} style={{ aspectRatio: '1 / 1' }} />;
          const entries = dateIndex[cell.iso] || [];
          const isToday = cell.iso === today;
          const isSelected = cell.iso === selectedDate;
          const groupsHere = Array.from(new Set(entries.map((tid) => taskById[tid]?.group).filter(Boolean)));

          return (
            <button key={i} onClick={() => setSelectedDate(isSelected ? null : cell.iso)}
              className="relative flex flex-col items-stretch justify-between p-1 text-left transition-transform hover:scale-[1.05]"
              style={{ aspectRatio: '1 / 1',
                       background: isSelected ? '#2a1f15' : isToday ? '#faf0d8' : '#f4ede0',
                       color: isSelected ? '#f4ede0' : '#2a1f15',
                       border: `1px solid ${isToday && !isSelected ? '#a87a2c' : '#2a1f15'}` }}>
              <div className="flex items-start justify-between">
                <span className="mono text-[11px] font-semibold leading-none">{cell.d}</span>
                {entries.length > 0 && (
                  <span className="mono text-[9px] font-bold" style={{ color: isSelected ? '#f4ede0' : '#7a5f3f' }}>
                    {entries.length}
                  </span>
                )}
              </div>
              <div className="flex flex-wrap gap-[2px] justify-start">
                {groupsHere.slice(0, 4).map((g) => (
                  <span key={g} style={{ width: 6, height: 6, borderRadius: '50%',
                                         background: GROUP_META[g]?.color || '#7a5f3f' }} />
                ))}
              </div>
            </button>
          );
        })}
      </div>

      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-3 mono text-[10px] uppercase tracking-widest" style={{ color: '#7a5f3f' }}>
        {GROUP_ORDER.map((g) => (
          <div key={g} className="flex items-center gap-1.5">
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: GROUP_META[g].color, display: 'inline-block' }} />
            {g}
          </div>
        ))}
      </div>

      {selectedDate && (
        <div className="mt-5 p-4 fadein" style={{ background: '#ebe0c9', border: '1.5px solid #2a1f15', boxShadow: '2px 2px 0 #2a1f15' }}>
          <div className="flex items-baseline justify-between mb-3">
            <h3 className="text-lg font-bold" style={{ letterSpacing: '-0.02em' }}>{formatDateLong(selectedDate)}</h3>
            <span className="mono text-xs" style={{ color: '#7a5f3f' }}>{selectedEntries.length} logged</span>
          </div>

          {selectedEntries.length === 0 && (
            <p className="text-sm italic" style={{ color: '#7a5f3f' }}>Nothing logged on this day.</p>
          )}

          {selectedEntries.length > 0 && (
            <ul className="space-y-1.5">
              {selectedEntries.map((t) => (
                <li key={t.id} className="flex items-center justify-between px-3 py-2"
                  style={{ background: '#f4ede0', border: '1px solid #2a1f15' }}>
                  <div className="flex items-center gap-2 min-w-0">
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: GROUP_META[t.group].color, flexShrink: 0 }} />
                    <span className="text-sm truncate">
                      <span className="font-semibold">{t.label}</span>
                      <span className="italic" style={{ color: '#7a5f3f' }}> · {t.group}</span>
                    </span>
                  </div>
                  <button onClick={() => onRemoveEntry(t.id, selectedDate)}
                    className="p-1.5 hover:bg-black/5 flex-shrink-0"
                    style={{ color: '#c44536' }}
                    aria-label="Remove entry" title="Remove entry">
                    <Trash2 size={13} />
                  </button>
                </li>
              ))}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChoreTracker />);
</script>
</body>
</html>
